<main class="wrap"><header class="hero"><div class="eyebrow">使用者研究 ／ 問卷預覽</div><h1>會計工作簿更新與<br>財務報表流程調查</h1><p id="intro"></p><div class="meta">繁體中文 · 聯絡方式選填 · 請勿填寫機密資訊</div></header><div class="progress" aria-hidden="true"></div><div id="status" class="meta" aria-live="polite"></div><form id="survey" novalidate></form><div class="nav" id="nav"></div><footer class="foot">Google 表單風格的獨立版面預覽，並非 Google 提供或託管的表單。<br>可點選選項及切換頁面；尚未發佈或收集回覆。</footer></main>
<script>

            "每季",
            "每年",
            "每個案件",
            "不定期",

          ]

    },
    {
      "title": "第三部分｜Excel 更新與差異分析",
      "intro": "這裡的「工作簿」指整個 Excel 檔案；「工作表」指其中的分頁。",
      "questions": [
        [
          "9",
          "新一期資料通常如何加入工作簿？",
          "checkbox",
          [
            "取代原有的來源資料",
            "在原有資料後新增交易",
            "修正已存在的交易",
            "重新整理資料連線或查詢",
            "手動更新計算結果或輸出儲存格",

          ]
        ],
        [
          "10",
          "哪些計算規則或工作簿內容必須保留？您目前如何確認它們沒有被改動？",
          "textarea",
          []
        ],
        [
          "11",
          "更新資料後，您最常進行哪一種比較？",
          "radio",
          [
            "本期與前期比較",
            "同一期修正版與先前版本比較",

            "未進行比較／不適用"
          ]
        ],
        [
          "12",
          "您實際使用哪些工具完成這些工作？",
          "checkbox",
          [
            "Excel（含 Power Query 或巨集）",
            "Caseware",
            "CCH",
            "Thomson Reuters Engagement Manager",
            "Fieldguide",
            "Workiva",
            "DataSnipper",
            "Truewind",
            "FloQast／BlackLine／Numeric",
            "公司或事務所自行開發的工具",

          ]
        ],
        [
          "13",
          "現有工具已經幫您做好哪些事？還有哪些步驟需要人工處理？",
          "textarea",
          []
        ]
      ]
    },
    {
      "title": "第四部分｜對產品構想的看法",
      "intro": "以下是尚在探索中的產品構想，並非已完成功能或效能承諾。\n\n我們正在探索一個助理：使用您現有的工作簿與企業提供的新資料，更新指定的來源區域、保留已確認的計算規則、找出差異，並產生供覆核的財務報表草稿。它會呈現變更與佐證來源，並標示缺漏資料或不確定的對應關係。",
      "questions": [
        [
          "14",
          "如果有幫助，這個助理對您最有價值的環節會是哪一項？",
          "radio",
          [
            "更新來源資料",
            "檢查工作簿與公式完整性",
            "差異分析",
            "編製財務報表或附註草稿",

            "與我的工作無關",
            "不確定"
          ]
        ],
        [
          "15",
          "使用它產出的結果之前，您最需要確認哪些事項？",
          "checkbox",
          [
            "來源資料完整",
            "受保護的公式未被更動",
            "計算結果正確",
            "變動原因說明清楚",
            "能追溯至佐證資料",

            "其他",
            "不確定"
          ]
        ],
        [
          "16",
          "您認為試用這個流程最大的障礙是什麼？",
          "radio",
          [
            "資料使用或處理的核准",

            "檔案或系統相容性",

;
const answers={};let page=0;const history=[];
const form=document.querySelector('#survey');
document.querySelector('#intro').textContent=DATA.intro;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function button(text,fn,primary=false){const b=el('button',primary?'primary':'',text);b.type='button';b.onclick=fn;return b}
function go(next){history.push(page);page=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function contactChoice(){return answers[page===4?'A3':'17']}
function render(){
 form.replaceChildren();const nav=document.querySelector('#nav');nav.replaceChildren();const progress=document.querySelector('.progress');progress.replaceChildren();
 for(let i=0;i<4;i++)progress.append(el('div','step'+(page>=i?' active':'')));
 document.querySelector('#status').textContent=page<4?`主要問卷 ${page+1} / 4`:(page===4?'補充分支':page===5?'選填聯絡方式':'預覽完成');
 if(page===6){const c=el('section','card');c.append(el('h2','','預覽完成'),el('p','','這只是表單版面示範，沒有送出任何答案。正式發佈後，這裡可顯示感謝訊息與後續安排。'));form.append(c);nav.append(button('返回上一頁',back),button('從頭查看',()=>{page=0;history.length=0;render();window.scrollTo(0,0)},true));return}
 if(page===5){const c=el('section','card');const l=el('label','question','聯絡方式（選填）');l.htmlFor='contact';const input=el('input','entry');input.id='contact';input.placeholder='電子郵件或其他方便的聯絡方式';input.value=answers.contact||'';input.oninput=()=>answers.contact=input.value;c.append(l,el('p','hint','僅用於您選擇的後續交流；本預覽不會傳送資料。'),input);form.append(c);nav.append(button('返回',back),button('完成預覽',()=>go(6),true));return}
 const s=DATA.sections[page];const head=el('section','section');head.append(el('h2','',s.title),el('p','',s.intro));form.append(head);
 for(const [id,title,kind,options] of s.questions){
 const card=el('section','card');const heading=el('div','question',`${id}. ${title}`);heading.id='heading-'+id;card.setAttribute('aria-labelledby',heading.id);card.append(heading);
 if(id==='7')card.append(el('p','hint','包含修正時間，不包含等待他人的時間。'));
 if(id==='15')card.append(el('p','hint','最多選三項。'));
 if(kind==='textarea')card.append(el('p','hint','選填。請簡述，不需要提供客戶或機密資訊。'));
 if(kind==='text'||kind==='textarea'){const input=el(kind==='text'?'input':'textarea','entry');input.setAttribute('aria-labelledby',heading.id);input.placeholder='您的回答';input.value=answers[id]||'';input.oninput=()=>answers[id]=input.value;card.append(input)}
 else{
 for(const [idx,option] of options.entries()){
 const label=el('label','option');const input=el('input');input.type=kind;input.name='q'+id;input.value=option;input.checked=kind==='checkbox'?(answers[id]||[]).includes(option):answers[id]===option;
 input.onchange=()=>{if(kind==='radio'){answers[id]=option}else{let values=[...card.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(id==='15'&&values.length>3){input.checked=false;card.querySelector('.error').textContent='請最多選擇三項。';return}answers[id]=values;if(id==='15')card.querySelector('.error').textContent=''}};
 label.append(input,el('span','',option));card.append(label)}
 if(id==='15'){const error=el('div','error');error.setAttribute('role','alert');card.append(error)}
 if(options.some(o=>o==='其他'||o.includes('請補充'))){const extra=el('input','entry other');extra.placeholder='其他／補充說明（選填）';extra.setAttribute('aria-label',title+'：補充說明');extra.value=answers[id+'other']||'';extra.oninput=()=>answers[id+'other']=extra.value;card.append(extra)}
 }
 form.append(card)}
 if(history.length)nav.append(button('返回',back));
 nav.append(button(page===3||page===4?'下一步／完成':'下一步',()=>{
 if(page===0&&answers['4']==='從未參與')go(4);
 else if(page===3||page===4){const a=contactChoice();go(a&&a!=='目前不需要'?5:6)}
 else go(page+1)
 },true));nav.append(el('span','meta','預覽模式：可略過題目查看版面'));
}
function back(){page=history.pop()??0;render();window.scrollTo(0,0)}
form.addEventListener('submit',e=>e.preventDefault());render();
</script></body></html>
